version: 2

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    binary: surge
    main: .
    ldflags:
      - -s -w 
      - -X github.com/SurgeDM/Surge/cmd.Version={{.Version}}
      - -X github.com/SurgeDM/Surge/cmd.Commit={{.Commit}}
      - -X github.com/SurgeDM/Surge/cmd.BuildTime={{.Date}}

before:
  hooks:
    - ./scripts/package-fonts.sh
    - ./scripts/package-themes.sh

release:
  footer: |
    ---
    **Enjoying Surge?** Consider supporting the project to keep it blazing fast!
    - [GitHub Sponsors](https://github.com/sponsors/SurgeDM)
    - [Buy Me a Coffee](https://buymeacoffee.com/surge.downloader)
    - Release automation powered by [GoReleaser Pro](https://goreleaser.com/pro/)
  extra_files:
    - glob: .goreleaser-extra/fonts.zip
    - glob: .goreleaser-extra/themes.zip

changelog:
  sort: asc

  filters:
    exclude:
      - "^docs:"
      - "^test:"

archives:
  - id: surge
    formats: [ tar.gz ]
    format_overrides:
      - goos: windows
        formats: [ zip ]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

chocolateys:
  - name: surge
    ids:
      - surge
    package_source_url: https://github.com/SurgeDM/Surge
    owners: SurgeDM
    title: Surge
    project_url: https://github.com/SurgeDM/Surge
    url_template: "https://github.com/SurgeDM/Surge/releases/download/{{ .Tag }}/{{ .ArtifactName }}"
    copyright: 2025 Junaid Islam
    license_url: https://github.com/SurgeDM/Surge/blob/main/LICENSE
    require_license_acceptance: false
    project_source_url: https://github.com/SurgeDM/Surge
    docs_url: https://github.com/SurgeDM/Surge/blob/main/README.md
    bug_tracker_url: https://github.com/SurgeDM/Surge/issues
    tags: "surge download-manager downloader tui cli golang foss"
    summary: Blazing fast TUI download manager built in Go for power users.
    description: |
      Surge is a keyboard-driven terminal download manager with a fast Go backend,
      multi-connection downloads, mirror support, resumable transfers, a background
      server mode, and CLI automation commands.
    release_notes: "https://github.com/SurgeDM/Surge/releases/tag/{{ .Tag }}"
    api_key: "{{ .Env.CHOCOLATEY_API_KEY }}"
    source_repo: "https://push.chocolatey.org/"

homebrew_casks:
  - name: surge
    repository:
      owner: SurgeDM
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: "https://github.com/SurgeDM/Surge"
    
    description: "Blazing fast TUI download manager built in Go for power users"
    license: "MIT"
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/surge"]
          end
