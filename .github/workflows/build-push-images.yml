name: Build and Push Docker Images

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      surge_version:
        description: 'Surge version to use (leave empty for latest)'
        required: false
        default: ''
        type: string
      tag_as_latest:
        description: 'Tag as latest'
        required: false
        default: true
        type: boolean

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get Surge version
        id: surge-version
        run: |
          if [ -n "${{ inputs.surge_version }}" ]; then
            SURGE_VERSION="${{ inputs.surge_version }}"
            echo "Using manually specified version: $SURGE_VERSION"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            SURGE_VERSION="${GITHUB_REF_NAME#v}"
            echo "Using tag version: $SURGE_VERSION"
          else
            echo "Fetching latest Surge release..."
            SURGE_VERSION=$(curl -s https://api.github.com/repos/SurgeDM/Surge/releases/latest | jq -r .tag_name | sed 's/^v//')
            echo "Latest Surge version: $SURGE_VERSION"
          fi
          echo "version=$SURGE_VERSION" >> $GITHUB_OUTPUT

      - name: Wait for Release Assets
        run: |
          VERSION="${{ steps.surge-version.outputs.version }}"
          echo "Waiting for release assets for version v$VERSION to be published..."
          MAX_RETRIES=180
          RETRY_INTERVAL=20
          
          AMD64_URL="https://github.com/SurgeDM/Surge/releases/download/v${VERSION}/Surge_${VERSION}_linux_amd64.tar.gz"
          ARM64_URL="https://github.com/SurgeDM/Surge/releases/download/v${VERSION}/Surge_${VERSION}_linux_arm64.tar.gz"
          
          for ((i=1; i<=MAX_RETRIES; i++)); do
            if curl -s -f -I -L "$AMD64_URL" > /dev/null && curl -s -f -I -L "$ARM64_URL" > /dev/null; then
              echo "Release assets are available!"
              exit 0
            fi
            echo "Attempt $i/$MAX_RETRIES: Release not ready yet, waiting ${RETRY_INTERVAL}s..."
            sleep $RETRY_INTERVAL
          done
          
          echo "Timeout waiting for release assets after $((MAX_RETRIES * RETRY_INTERVAL / 60)) minutes."
          exit 1

      - name: Decide latest tag behavior
        id: latest-tag
        run: |
          ENABLE_LATEST=false
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            if [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              ENABLE_LATEST=true
            fi
          elif [[ "${{ inputs.tag_as_latest }}" == "true" ]]; then
            ENABLE_LATEST=true
          fi
          echo "enable=$ENABLE_LATEST" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.surge-version.outputs.version }}
            type=raw,value=latest,enable=${{ steps.latest-tag.outputs.enable }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: docker
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            SURGE_VERSION=${{ steps.surge-version.outputs.version }}

      - name: Summary
        run: |
          echo "## Docker Image Built Successfully! 🚀" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Surge Version:** ${{ steps.surge-version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Images pushed:**" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Platforms:** linux/amd64, linux/arm64" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Pull the image:" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.surge-version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
