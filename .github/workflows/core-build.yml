name: Core Build and Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
      - "!ext-v*"
  pull_request:
    branches:
      - main

permissions:
  actions: read
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      core: ${{ steps.filter.outputs.core }}
      tui: ${{ steps.filter.outputs.tui }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            core:
              - '!extension/**'
              - '**'
            tui:
              - 'internal/tui/**'
              - 'go.mod'
              - 'go.sum'

  test:
    name: Test and Check (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.core == 'true' || github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.0"
          check-latest: false
      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@latest
      - name: Build
        shell: bash
        run: go build -v ./...

      - name: Test
        shell: bash
        run: |
          cover_arg=""
          if [ "$RUNNER_OS" = "Linux" ]; then
            cover_arg="-coverprofile=coverage.out"
          fi
          gotestsum --junitfile test-results.xml --format testdox -- -race $cover_arg ./...
      - name: Comment Test Failures
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const signature = '<!-- core-build-test-failures-${{ matrix.os }} -->';
            
            // 1. Delete previous comments
            try {
              const comments = await github.paginate(github.rest.issues.listComments, {
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
              });
              
              for (const comment of comments) {
                if (comment.user?.type === 'Bot' && comment.body.includes(signature)) {
                  await github.rest.issues.deleteComment({
                    comment_id: comment.id,
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                  });
                }
              }
            } catch (err) {
              core.warning(`Could not delete old comments: ${err.message}`);
            }

            // 2. Post new comment if there are failures
            if (!fs.existsSync('test-results.xml')) return;
            const content = fs.readFileSync('test-results.xml', 'utf8');
            const regex = /<testcase classname="([^"]+)" name="([^"]+)"[^>]*>\s*<(?:failure|error)/g;
            let match;
            const failures = [];
            while ((match = regex.exec(content)) !== null) {
              failures.push(`- **${match[1]}**: \`${match[2]}\``);
            }
            if (failures.length > 0) {
              const body = `${signature}\n### ❌ Test Failures on \`${{ matrix.os }}\`\n` + failures.join('\n');
              try {
                await github.rest.issues.createComment({
                  issue_number: context.issue.number,
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  body: body
                });
              } catch (err) {
                // Fork PRs have a read-only token; log but don't fail the step.
                core.warning(`Could not post comment (fork PR?): ${err.message}`);
              }
            }
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        if: matrix.os == 'ubuntu-latest' && success() && hashFiles('coverage.out') != ''
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  tui-perf:
    name: TUI Performance Budget
    needs: changes
    if: needs.changes.outputs.tui == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.0"
          check-latest: false
      - name: Enforce TUI frame budgets
        env:
          GOMAXPROCS: "2"
          SURGE_PERF_BUDGET: "1"
        run: |
          set -o pipefail
          go test ./internal/tui -run '^TestTUI.*RenderPerfBudget$' -count=3 -v | tee tui-perf.txt
      - name: Report TUI performance values
        if: always()
        run: |
          {
            echo "### TUI performance budget"
            echo
            echo '```text'
            if [ -f tui-perf.txt ]; then
              cat tui-perf.txt
            else
              echo "No performance output was produced."
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Record TUI performance metadata
        if: always()
        shell: bash
        run: |
          {
            echo "sha=$GITHUB_SHA"
            echo "run_id=$GITHUB_RUN_ID"
            echo "run_number=$GITHUB_RUN_NUMBER"
            echo "runner_os=$RUNNER_OS"
            echo "runner_arch=$RUNNER_ARCH"
            echo "gomaxprocs=${GOMAXPROCS:-2}"
            date -u +"timestamp=%Y-%m-%dT%H:%M:%SZ"
          } > tui-perf-metadata.txt
      - name: Upload TUI performance history
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tui-perf-${{ github.run_number }}
          path: |
            tui-perf.txt
            tui-perf-metadata.txt
          if-no-files-found: ignore
          retention-days: 90

  tui-perf-regression:
    name: TUI Performance Regression
    needs: [changes, tui-perf]
    if: always() && needs.changes.outputs.tui == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Download current performance report
        uses: actions/download-artifact@v4
        with:
          name: tui-perf-${{ github.run_number }}
          path: current-perf

      - name: Compare with previous successful baseline
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_BRANCH: ${{ github.event.pull_request.base.ref || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail

          previous_run_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/core-build.yml/runs" \
            --method GET \
            --field "branch=${BASE_BRANCH}" \
            --field status=success \
            --field per_page=100 \
            --jq ".workflow_runs[] | select(.id != ${GITHUB_RUN_ID}) | .id" | head -n 1 || true)"

          if [ -z "$previous_run_id" ]; then
            printf '%s\n' "No previous successful TUI performance baseline found for ${BASE_BRANCH}; comparison skipped." > perf-comparison.txt
            cat perf-comparison.txt
            exit 0
          fi

          artifact_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${previous_run_id}/artifacts" \
            --jq '.artifacts[] | select(.expired == false and (.name | startswith("tui-perf-"))) | .id' | head -n 1)"
          if [ -z "$artifact_id" ]; then
            printf '%s\n' "Previous run ${previous_run_id} has no unexpired TUI performance artifact; comparison skipped." > perf-comparison.txt
            cat perf-comparison.txt
            exit 0
          fi

          mkdir -p previous-perf
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > previous-perf.zip
          unzip -q previous-perf.zip -d previous-perf

          CURRENT_REPORT="$(find current-perf -name tui-perf.txt -type f -print -quit)"
          PREVIOUS_REPORT="$(find previous-perf -name tui-perf.txt -type f -print -quit)"
          if [ -z "$CURRENT_REPORT" ] || [ -z "$PREVIOUS_REPORT" ]; then
            printf '%s\n' "Performance report missing from current or previous artifact; comparison skipped." > perf-comparison.txt
            cat perf-comparison.txt
            exit 0
          fi

          python3 scripts/compare_tui_perf.py \
            --current "$CURRENT_REPORT" \
            --previous "$PREVIOUS_REPORT" \
            --output perf-comparison.txt

      - name: Report performance comparison
        if: always()
        run: |
          {
            echo "### TUI performance regression"
            echo
            echo '```text'
            if [ -f perf-comparison.txt ]; then
              cat perf-comparison.txt
            else
              echo "No comparison output was produced."
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload performance comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tui-perf-comparison-${{ github.run_number }}
          path: perf-comparison.txt
          if-no-files-found: ignore
          retention-days: 90

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: test
    # Extra guard: only core tags (v*), never extension tags (ext-v*)
    if: startsWith(github.ref, 'refs/tags/v') && !startsWith(github.ref, 'refs/tags/ext-v')
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.0"
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser-pro
          version: latest
          args: release --clean
        env:
          GORELEASER_KEY: ${{ secrets.GORELEASER_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
